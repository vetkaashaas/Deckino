appId: com.deckino.app.preview
name: A2 - search the catalogue and open a card
---
- launchApp
- extendedWaitUntil:
    visible: "Profile and settings" # Home is up, signed in or not
    timeout: 30000
- tapOn: "Cards"
- tapOn: "Search cards"
- inputText: "lightning bolt"
- hideKeyboard
- extendedWaitUntil:
    visible: "Lightning Bolt, .*"
    timeout: 15000
- takeScreenshot: a2-01-search
- tapOn: "Sort: .*"
- tapOn: "Newest"
- tapOn: "Done"
- swipe: # the filter row: a sort adds Clear at its start, which pushes Sort off screen
    start: 90%, 21%
    end: 10%, 21%
- assertVisible: "Sort: Newest"
- tapOn: "Lightning Bolt, .*"
- extendedWaitUntil:
    visible: "Lightning Bolt deals 3 damage to any target."
    timeout: 15000
- assertVisible: "Instant"
- takeScreenshot: a2-02-card-page
- scrollUntilVisible:
    element: "[0-9]+ printings"
- takeScreenshot: a2-03-prices-and-printings
