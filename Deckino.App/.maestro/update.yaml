appId: com.deckino.app.preview
name: A1 - an app below the minimum version shows the update screen
---
- runScript:
    file: scripts/minimum-version.js
    env:
      VERSION: "99.0.0"
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Update Deckino"
    timeout: 30000
- assertVisible: "Open Google Play"
- takeScreenshot: a1-04-update-required
- runScript:
    file: scripts/minimum-version.js
    env:
      VERSION: "0.0.0"
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Every card, one scan away" # the welcome screen, as on any first launch
    timeout: 30000
- tapOn: "Look around first"
- extendedWaitUntil:
    visible: "Point your camera at a Magic card.*" # Home is up (the tagline sits above the buttons, which a small phone can push below the fold)
    timeout: 15000
