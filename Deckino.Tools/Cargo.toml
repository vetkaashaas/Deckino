[workspace]
resolver = "3"
members = ["core", "app"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[profile.dev.package."*"]
opt-level = 2 # image decoding and hashing are unusably slow unoptimized
debug = false # dependencies' debug info is most of target/'s size

[profile.dev]
debug = "line-tables-only" # backtraces keep file:line; full debug info triples the build folder
