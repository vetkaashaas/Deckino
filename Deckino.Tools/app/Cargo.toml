[package]
name = "deckino-tools"
version.workspace = true
edition.workspace = true

[[bin]]
name = "deckino-tools"
path = "src/main.rs"

[dependencies]
deckino-core = { path = "../core" }
chrono = "0.4"
anyhow = "1"
futures = "0.3"
gpui-kit = "0.9"
image = "0.25"
rfd = "0.18"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
velopack = "1.2"

[build-dependencies]
winresource = "0.1"
