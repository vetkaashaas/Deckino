[package]
name = "deckino-core"
version.workspace = true
edition.workspace = true

# The Toolbox's services: no UI. The app (../app) shows them with GPUI.
[dependencies]
anyhow = "1"
aws-credential-types = { version = "1", features = ["hardcoded-credentials"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1"
futures = "0.3"
hex = "0.4"
image = "0.25"
md-5 = "0.10"
regex = "1"
velopack = { version = "1.2", features = ["public-utils"] } # public-utils: a custom UpdateSource names bundle::Manifest
windows-registry = "0.6"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "gzip", "rustls"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
zip = "9"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory"] }
