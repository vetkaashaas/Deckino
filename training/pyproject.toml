[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "deckino-training"
version = "0.1.0"
description = "Offline dataset preparation and metric-learning CLI for Deckino"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.1,<3",
  "Pillow>=11,<13",
  "torch>=2.7,<3",
  "torchvision>=0.22,<1",
]

[project.scripts]
deckino-training = "deckino_training.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
