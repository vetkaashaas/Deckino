[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "deckino-training"
version = "0.4.3"
description = "Offline dataset preparation and metric-learning CLI for Deckino"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.1.3",
  "Pillow==11.3.0",
  "torch==2.4.1",
  "torchvision==0.19.1",
]

[project.scripts]
deckino-training = "deckino_training.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
